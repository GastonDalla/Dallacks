<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Dallacks">
  <rect width="64" height="64" rx="14" fill="#0A0A0A"/>
  <!-- Pixel "D" rendered on an 8x8 grid (cell = 6px) inset at (8,8) -->
  <g fill="#FF7A1A" shape-rendering="crispEdges">
    <!-- left stem -->
    <rect x="14" y="14" width="6" height="36"/>
    <!-- top bar -->
    <rect x="20" y="14" width="18" height="6"/>
    <!-- bottom bar -->
    <rect x="20" y="44" width="18" height="6"/>
    <!-- right curve (stepped) -->
    <rect x="38" y="20" width="6" height="6"/>
    <rect x="44" y="26" width="6" height="12"/>
    <rect x="38" y="38" width="6" height="6"/>
  </g>
</svg>
